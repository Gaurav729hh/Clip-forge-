
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI ClipForge</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #10131c;
      color: white;
      text-align: center;
      padding: 30px 16px;
    }
    .container {
      max-width: 600px;
      margin: 50px auto;
      padding: 28px;
      background: #1c2230;
      border-radius: 16px;
    }
    h1 {
      color: #7c9cff;
    }
    p {
      color: #c5cada;
      line-height: 1.6;
    }
    button {
      background: #587cff;
      color: white;
      border: 0;
      padding: 13px 22px;
      border-radius: 8px;
      font-size: 16px;
      margin-top: 15px;
    }
    input {
      width: 100%;
      margin-top: 20px;
      padding: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>AI ClipForge</h1>
    <p>Turn long videos into amazing short clips.</p>
    <h3>Upload Your Video</h3>
    <input type="file" accept="video/*">
    <button onclick="alert('Welcome to AI ClipForge!')">
      Get Started
    </button>
    <p>Hindi | English | Hinglish</p>
  </div>
</body>
</html>
